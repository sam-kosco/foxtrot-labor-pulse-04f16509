# One-off manual job (2026-08-31): push the QB-billed price uplift into the
# Private and MRO Pulse Locations workbook via the Graph workbook API.
# Delete this workflow (and patch_mro_prices.py) after the run succeeds.
name: MRO Price Patch (one-off)

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - env:
          TENANT_ID:     ${{ secrets.TENANT_ID }}
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: python patch_mro_prices.py

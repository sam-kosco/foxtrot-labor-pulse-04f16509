name: Daily Pulse Refresh

on:
  schedule:
    # Both fire; the guard step lets only the run where it is 9 AM in
    # America/New_York proceed — 9 AM Eastern year-round across DST.
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:
    # Always available for manual refresh from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commits the rebuilt page back to the repo
      pages: write      # lets the verify step re-request a stalled Pages build

    steps:
      - name: Check out repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # guard needs history to find today's refresh commit

      - name: Daily refresh guard (9 AM Eastern, cron-delay tolerant)
        id: guard
        run: |
          # GitHub crons often fire 30-60+ min late, so never require an exact
          # hour: a scheduled run proceeds if it's 9 AM or later Eastern and
          # no refresh commit has landed yet today. Manual runs always proceed.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          export TZ=America/New_York
          H=$(date +%H); TODAY=$(date +%F)
          LAST=$(git log -1 --grep "chore: refresh pulse" \
                 --format=%cd --date=format-local:%F 2>/dev/null || true)
          if [ "$H" -lt 9 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Before 9 AM Eastern (hour=$H) — skipping."
          elif [ "$LAST" = "$TODAY" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Already refreshed today ($TODAY) — skipping."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: pip install openpyxl pandas requests

      - name: Fetch sources from SharePoint
        if: steps.guard.outputs.run == 'true'
        env:
          TENANT_ID:     ${{ secrets.TENANT_ID }}
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: python fetch_sources.py

      - name: Build pulse page
        if: steps.guard.outputs.run == 'true'
        env:
          PULSE_DATA_DIR: sources
          TZ: America/New_York
        run: python build_pulse.py

      - name: Commit and push
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html pulse_data.json
          git diff --cached --quiet || git commit -m "chore: refresh pulse [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push

      - name: Verify the new build is actually live
        if: steps.guard.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Committing is not deploying. GitHub Pages deploys have failed with a
          # 503 or stalled in "building" several times, leaving ops on a stale
          # page while this workflow reported success. Poll the real site for
          # this run's build stamp; nudge a rebuild if it stalls; fail loudly if
          # it never lands.
          EXPECT=$(grep -oE '"generated": "[^"]+"' index.html | head -1)
          if [ -z "$EXPECT" ]; then
            echo "::error::no build stamp found in index.html"; exit 1
          fi
          # Derived, not hardcoded, so this survives a repo rename or org move.
          OWNER=$(echo "${GITHUB_REPOSITORY%%/*}" | tr 'A-Z' 'a-z')
          SITE="https://${OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          echo "waiting for ${SITE} to serve ${EXPECT}"

          nudged=0
          for i in $(seq 1 40); do            # 40 x 30s = 20 minutes
            # cache-buster: Pages/CDN serves max-age=600, -L follows a CNAME
            LIVE=$(curl -sSL --max-time 30 "${SITE}?cb=${GITHUB_RUN_ID}-${i}" \
                   | grep -oE '"generated": "[^"]+"' | head -1 || true)
            if [ "$LIVE" = "$EXPECT" ]; then
              echo "live after $((i * 30))s — ${EXPECT}"; exit 0
            fi
            if [ "$i" -eq 10 ] && [ "$nudged" -eq 0 ]; then
              echo "no deploy after 5 min — requesting a Pages rebuild"
              gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null \
                && nudged=1 || echo "rebuild request failed; still polling"
            fi
            sleep 30
          done

          echo "The refresh itself succeeded and committed; this is a Pages"
          echo "deploy failure. Check githubstatus.com, then re-run this run."
          gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" \
            --jq '{status, error: .error.message}' || true
          echo "::error::Pages never served ${EXPECT} after 20 min (site still on ${LIVE:-unknown})"
          exit 1

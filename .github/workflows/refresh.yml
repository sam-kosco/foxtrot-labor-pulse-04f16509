name: Daily Pulse Refresh

on:
  schedule:
    # Both fire; the guard step lets only the run where it is 9 AM in
    # America/New_York proceed — 9 AM Eastern year-round across DST.
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:
    # Always available for manual refresh from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commits the rebuilt page back to the repo

    steps:
      - name: 9 AM Eastern guard
        id: guard
        run: |
          H=$(TZ=America/New_York date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$H" != "09" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not 9 AM Eastern (hour=$H) — skipping."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repo
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v6

      - name: Set up Python
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: pip install openpyxl pandas requests

      - name: Fetch sources from SharePoint
        if: steps.guard.outputs.run == 'true'
        env:
          TENANT_ID:     ${{ secrets.TENANT_ID }}
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: python fetch_sources.py

      - name: Build pulse page
        if: steps.guard.outputs.run == 'true'
        env:
          PULSE_DATA_DIR: sources
          TZ: America/New_York
        run: python build_pulse.py

      - name: Commit and push
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html pulse_data.json
          git diff --cached --quiet || git commit -m "chore: refresh pulse [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push

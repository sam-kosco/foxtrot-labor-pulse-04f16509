name: Daily Pulse Refresh
# Poll-triggered refresh (2026-08-21): every half hour during the working
# window, a light job asks Graph for the sources' lastModifiedDateTime and a
# full rebuild runs only when something changed. So the main refresh follows
# fresh Paylocity hours within minutes of the ~6 AM Eastern relay, same-day
# debrief edits surface within the poll interval, and a late delivery is
# picked up whenever it actually lands — no fixed-time race, and the 13:15
# UTC monitor digest always runs after the day's main build.
# (The workflow name is load-bearing: mirror.yml's workflow_run matches it.)

on:
  schedule:
    # 10:00-22:30 UTC ≈ 6 AM-6:30 PM Eastern across DST. Before 10:00 UTC
    # nothing upstream changes; overnight edits catch the first morning poll.
    - cron: "*/30 10-22 * * *"
  workflow_dispatch:
    # Always available for manual refresh from the Actions tab (skips the
    # change check and rebuilds unconditionally)

concurrency:
  group: pulse-refresh
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.probe.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Probe source freshness (metadata only)
        id: probe
        env:
          TENANT_ID:     ${{ secrets.TENANT_ID }}
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "manual dispatch — building unconditionally"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pip install -q requests
          python check_sources.py

  refresh:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commits the rebuilt page back to the repo
      pages: write      # lets the verify step re-request a stalled Pages build

    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openpyxl pandas requests

      - name: Fetch sources from SharePoint
        env:
          TENANT_ID:     ${{ secrets.TENANT_ID }}
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: python fetch_sources.py

      - name: Build pulse page
        env:
          PULSE_DATA_DIR: sources
          TZ: America/New_York
        run: python build_pulse.py

      - name: Build Private/MRO hours feed
        # continue-on-error so a bad MRO workbook sheet (missing dist, dist
        # claimed by both pulses) can't leave ops on a stale COMMERCIAL page;
        # the last step still turns the run red so the failure stays loud.
        id: mro
        continue-on-error: true
        env:
          PULSE_DATA_DIR: sources
          TZ: America/New_York
        run: python build_mro_hours.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # sources_meta.json is the poll baseline: committing the stamps of
          # THIS build is what lets the next check say "nothing changed".
          cp sources/sources_meta.json sources_meta.json
          # mro_hours.json is unchanged (stale, harmless) if its build failed
          git add index.html pulse_data.json sources_meta.json mro_hours.json
          git diff --cached --quiet || git commit -m "chore: refresh pulse [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push

      - name: Verify the new build is actually live
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Committing is not deploying. GitHub Pages deploys have failed with a
          # 503 or stalled in "building" several times, leaving ops on a stale
          # page while this workflow reported success. Poll the real site for
          # this run's build stamp; nudge a rebuild if it stalls; fail loudly if
          # it never lands.
          EXPECT=$(grep -oE '"generated": "[^"]+"' index.html | head -1)
          if [ -z "$EXPECT" ]; then
            echo "::error::no build stamp found in index.html"; exit 1
          fi
          # Derived, not hardcoded, so this survives a repo rename or org move.
          OWNER=$(echo "${GITHUB_REPOSITORY%%/*}" | tr 'A-Z' 'a-z')
          SITE="https://${OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          echo "waiting for ${SITE} to serve ${EXPECT}"

          nudged=0
          for i in $(seq 1 40); do            # 40 x 30s = 20 minutes
            # cache-buster: Pages/CDN serves max-age=600, -L follows a CNAME
            LIVE=$(curl -sSL --max-time 30 "${SITE}?cb=${GITHUB_RUN_ID}-${i}" \
                   | grep -oE '"generated": "[^"]+"' | head -1 || true)
            if [ "$LIVE" = "$EXPECT" ]; then
              echo "live after $((i * 30))s — ${EXPECT}"; exit 0
            fi
            if [ "$i" -eq 10 ] && [ "$nudged" -eq 0 ]; then
              echo "no deploy after 5 min — requesting a Pages rebuild"
              gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null \
                && nudged=1 || echo "rebuild request failed; still polling"
            fi
            sleep 30
          done

          echo "The refresh itself succeeded and committed; this is a Pages"
          echo "deploy failure. Check githubstatus.com, then re-run this run."
          gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" \
            --jq '{status, error: .error.message}' || true
          echo "::error::Pages never served ${EXPECT} after 20 min (site still on ${LIVE:-unknown})"
          exit 1

      - name: Fail if the MRO feed build failed
        if: steps.mro.outcome == 'failure'
        run: |
          echo "::error::build_mro_hours.py failed — the commercial pulse refreshed fine, but mro_hours.json is stale. Check the 'Build Private/MRO hours feed' step log (bad workbook sheet? dist claimed by both pulses?)."
          exit 1
